            - { name: KAFKA_ENABLED, value: "true" }
            - { name: KAFKA_BOOTSTRAP, value: "redpanda.voltera-app:9092" }
          resources:
            limits: { cpu: "500m", memory: "512Mi" }        # cpu limit para acotar el pod
            requests: { cpu: "50m", memory: "160Mi" }       # cpu request -> BASE del calculo del HPA
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 6
