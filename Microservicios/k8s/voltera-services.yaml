apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarifas-service
  namespace: voltera-app
  labels: { app: tarifas-service }
  annotations:
    voltera.io/diagrama-04: "Servicio de Tarifas"
    voltera.io/rol: "Cálculo/asignación de tarifa (CQRS write/read)"
spec:
  replicas: 2                                   # HA: 2 replicas base (el HPA ajusta entre min/max)
  selector: { matchLabels: { app: tarifas-service } }
  template:
    metadata:
      labels: { app: tarifas-service, version: v1 }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8084"
    spec:
      imagePullSecrets: [{ name: harbor-cred }]
      containers:
        - name: tarifas-service
          image: 192.168.3.13/app-voltaire/tarifas-service:1.0.1
          ports: [{ containerPort: 8084 }]
          env:
            - { name: EUREKA_ENABLED, value: "true" }
            - { name: EUREKA_URL, value: "http://service-registry:8761/eureka/" }
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "redpanda.voltera-app:9092" }
            - { name: SPRING_PROFILES_ACTIVE, value: "inbox-jdbc,cqrs-jdbc" }
            - { name: INBOX_URL, value: "jdbc:postgresql://timescaledb.voltera-app:5432/voltera_inbox" }
            - { name: INBOX_USER, value: "voltera" }
            - { name: INBOX_PASSWORD, valueFrom: { secretKeyRef: { name: timescaledb-cred, key: POSTGRES_PASSWORD } } }
            # CQRS · Database per Service (diagrama 04): BD escritura + BD lectura.
            - { name: CQRS_WRITE_URL, value: "jdbc:postgresql://timescaledb.voltera-app:5432/voltera_tarifas_write" }
            - { name: CQRS_READ_URL, value: "jdbc:postgresql://timescaledb.voltera-app:5432/voltera_tarifas_read" }
            - { name: CQRS_USER, value: "voltera" }
            - { name: CQRS_PASSWORD, valueFrom: { secretKeyRef: { name: timescaledb-cred, key: POSTGRES_PASSWORD } } }
          resources:
            limits: { cpu: "500m", memory: "512Mi" }        # cpu limit para acotar el pod
            requests: { cpu: "50m", memory: "160Mi" }       # cpu request -> BASE del calculo del HPA
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8084 }
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: tarifas-service
  namespace: voltera-app
spec:
  selector: { app: tarifas-service }
  ports: [{ port: 8084, targetPort: 8084 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tarifas-service
  namespace: voltera-app
spec:
  parentRefs:
    - name: istio-ingress
      namespace: istio-ingress
  rules:
    - matches:
        - path: { type: PathPrefix, value: /tarifas }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: "" }
      backendRefs:
        - name: tarifas-service
          port: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagos-service
  namespace: voltera-app
  labels: { app: pagos-service }
spec:
  replicas: 2                                   # HA: 2 replicas base (el HPA ajusta entre min/max)
  selector: { matchLabels: { app: pagos-service } }
  # maxSurge=0: el worker tiene poca RAM y no admite un pod extra durante el rollout,
  # así que se termina el pod viejo antes de crear el nuevo (evita quedar Pending).
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  template:
    metadata:
      labels: { app: pagos-service, version: v1 }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8085"
    spec:
      imagePullSecrets: [{ name: harbor-cred }]
      containers:
        - name: pagos-service
          image: 192.168.3.13/app-voltaire/pagos-service:1.0.1
          ports: [{ containerPort: 8085 }]
          env:
            - { name: EUREKA_ENABLED, value: "true" }
            - { name: EUREKA_URL, value: "http://service-registry:8761/eureka/" }
          resources:
            limits: { cpu: "500m", memory: "512Mi" }        # cpu limit para acotar el pod
            requests: { cpu: "50m", memory: "160Mi" }       # cpu request -> BASE del calculo del HPA
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8085 }
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: pagos-service
  namespace: voltera-app
spec:
  selector: { app: pagos-service }
  ports: [{ port: 8085, targetPort: 8085 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pagos-service
  namespace: voltera-app
spec:
  parentRefs:
    - name: istio-ingress
      namespace: istio-ingress
  rules:
    - matches:
        - path: { type: PathPrefix, value: /pagos }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: "" }
      backendRefs:
        - name: pagos-service
          port: 8085
