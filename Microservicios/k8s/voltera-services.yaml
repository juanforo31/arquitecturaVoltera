  template:
    metadata:
      labels: { app: liquidacion-p2p-service, version: v1 }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      imagePullSecrets: [{ name: harbor-cred }]
      containers:
        - name: liquidacion-p2p-service
          image: 192.168.3.13/app-voltaire/liquidacion-p2p-service:1.0.1
